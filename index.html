<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />

    <!-- Carregue depois do style.css -->
    <link
      rel="stylesheet"
      href="Components/perfil-header.css"
    />

    <title>BarberExpress</title>
  </head>

  <body class="deslogado">
    <header class="topo">
      <div class="logo">
        <a
          id="Tesoura"
          href="./index.html"
          aria-label="Página inicial"
        >
          <img
            src="./img/logo/Tesoura.svg"
            alt=""
          />
        </a>

        <a
          id="BarberExpress"
          href="./index.html"
        >
          <img
            src="./img/logo/nomeLogo.svg"
            alt="BarberExpress"
          />
        </a>
      </div>

      <!-- Perfil do header -->
      <div
        class="div_perfil"
        id="area-perfil"
      >
        <a
          href="./Page/Agendamentos/agendamentos.html"
          id="agendamentos-link"
          class="agendamentos-link"
          hidden
        >
          <img
            src="./img/icon/agenda.svg"
            id="icon-agenda"
            alt=""
          />

          <span id="agendamentos-texto">
            Agendamentos
          </span>
        </a>

        <div id="container-perfil">
          <button
            type="button"
            id="perfil"
          >
            Entrar
          </button>
        </div>

        <div
          id="menu-usuario-dropdown"
          hidden
        >
          <div class="menu-dropdown-conteudo">
            <div
              id="menu-avatar"
              class="avatar-grande"
            >
              U
            </div>

            <h3 id="menu-nome">
              Usuário
            </h3>

            <p id="menu-email">
              email@provedor.com
            </p>

            <hr class="divisor-menu" />

            <button
              type="button"
              id="btn-logout"
            >
              Sair da conta
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Modal principal -->
    <div
      class="modal-autenticacao login"
      hidden
    >
      <div class="modal-conteudo">
        <button
          type="button"
          class="fechar-modal"
          aria-label="Fechar"
        >
          ×
        </button>

        <h2>Acesse a plataforma</h2>

        <p>
          Entre na sua conta ou crie um cadastro
          para realizar agendamentos.
        </p>

        <div class="opcoes-autenticacao">
          <button
            type="button"
            id="abrir-cadastro"
          >
            Criar conta
          </button>

          <button
            type="button"
            id="abrir-login"
          >
            Entrar
          </button>
        </div>
      </div>
    </div>

    <!-- Modal de login -->
    <div
      class="modal-autenticacao Entrar"
      hidden
    >
      <div class="modal-conteudo">
        <button
          type="button"
          class="voltar-modal"
          aria-label="Voltar"
        >
          ‹
        </button>

        <button
          type="button"
          class="fechar-modal"
          aria-label="Fechar"
        >
          ×
        </button>

        <h2>Entre na sua conta</h2>

        <input
          type="email"
          class="Email1"
          placeholder="E-mail"
          autocomplete="email"
        />

        <input
          type="password"
          class="Senha1"
          placeholder="Senha"
          autocomplete="current-password"
        />

        <button
          type="button"
          id="confirmar-login"
          class="botao-autenticacao"
        >
          Entrar
        </button>

        <button
          type="button"
          id="reenviar-confirmacao"
          class="botao-link"
        >
          Não recebeu o e-mail? Reenviar confirmação
        </button>
      </div>
    </div>

    <!-- Modal de cadastro -->
    <div
      class="modal-autenticacao Cadastrar"
      hidden
    >
      <div class="modal-conteudo">
        <button
          type="button"
          class="voltar-modal"
          aria-label="Voltar"
        >
          ‹
        </button>

        <button
          type="button"
          class="fechar-modal"
          aria-label="Fechar"
        >
          ×
        </button>

        <h2>Crie sua conta</h2>

        <input
          type="text"
          class="NomeCadastro"
          placeholder="Nome"
          autocomplete="name"
        />

        <input
          type="email"
          class="EmailCadastro"
          placeholder="E-mail"
          autocomplete="email"
        />

        <input
          type="password"
          class="SenhaCadastro"
          placeholder="Senha"
          autocomplete="new-password"
        />

        <button
          type="button"
          id="confirmar-cadastro"
          class="botao-autenticacao"
        >
          Cadastrar
        </button>
      </div>
    </div>

    <section class="LoginCubo1">
      <div class="cabecalho-conteudo">
        <div class="cabecalho-esquerda">
          <h2 class="h2Cabecalho">
            Olá, faça seu login!
          </h2>

          <h4
            class="h4Cabecalho"
            id="data-cabecalho"
          ></h4>

          <div class="busca-container">
            <input
              type="text"
              placeholder="Buscar barbearias"
              class="buscBarb"
              autocomplete="off"
            />

            <button
              type="button"
              class="btnPesquisa"
              aria-label="Pesquisar"
            ></button>
          </div>

          <div class="agendamentos">
            <br />
            <br />

            <article class="card-agendamento">
              <div class="lado-esquerdo">
                <span class="status confirmado">
                  Confirmado
                </span>

                <h3 id="nome-do-serviço-card-de-agendamento">
                  Corte de cabelo
                </h3>

                <div class="barbearia-mini">
                  <img
                    src="./img/logo/imagem7.svg"
                    alt="Vintage Barber"
                  />

                  <span>
                    Vintage Barber
                  </span>
                </div>
              </div>

              <div class="lado-direito">
                <span>Fevereiro</span>
                <h2>06</h2>
                <span>09:45</span>
              </div>
            </article>
          </div>
        </div>

        <div class="Recomendados">
          <h2 class="RECO">
            Recomendados
          </h2>

          <button
            type="button"
            class="btn-scrollEs esquerda"
            onclick="rolarRecomendados(-1)"
            aria-label="Voltar"
          >
            ❮
          </button>

          <div id="cardsRecomendados"></div>

          <button
            type="button"
            class="btn-scrollDi direita"
            onclick="rolarRecomendados(1)"
            aria-label="Avançar"
          >
            ❯
          </button>
        </div>
      </div>
    </section>

    <section class="Populares">
      <h2 class="POPU">
        Populares
      </h2>

      <button
        type="button"
        class="btn-scrollEs esquerda"
        onclick="rolarPopulares(-1)"
        aria-label="Voltar"
      >
        ❮
      </button>

      <div id="cardsPopulares"></div>

      <button
        type="button"
        class="btn-scrollDi direita"
        onclick="rolarPopulares(1)"
        aria-label="Avançar"
      >
        ❯
      </button>
    </section>

    <section class="MaisVisitados">
      <h2 class="MaisVis">
        Mais visitados
      </h2>

      <button
        type="button"
        class="btn-scrollEs esquerda"
        onclick="rolarMaisVisitados(-1)"
        aria-label="Voltar"
      >
        ❮
      </button>

      <div id="cardsMaisVisitados"></div>

      <button
        type="button"
        class="btn-scrollDi direita"
        onclick="rolarMaisVisitados(1)"
        aria-label="Avançar"
      >
        ❯
      </button>
    </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase-client.js"></script>
<script src="./seed.js"></script>
<script src="./script.js"></script>

  </body>
</html>
