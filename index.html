
<!doctype html>
<html lang="pt-br">
  <head>

    <meta charset="UTF-8" />

    <!-- Fonte Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarberExpress</title>
  </head>

  <body>
    <!-- topo do site (header) -->
    <header class="topo">
      <div class="logo">
        <a id="Tesoura" href="index.html"><img src="./img/logo/Tesoura.svg" /></a>
        <a id="BarberExpress" href="index.html"><img src="./img/logo/nomeLogo.svg" /></a>
      </div>

          <div class="div_perfil" style="position: relative;">
            <img src="img/icon/agenda.svg" id="icon-agenda" style="display: none" />
          <button id="agendamentos-texto" style="border: none; background-color: transparent; cursor: pointer ;"
            onclick="location.href='Page/Agendamentos/agendamentos.html'">
            Agendamentos
          </button>            
            <div id="container-perfil">
              <button id="perfil" onclick="btnAbalogin()">Entrar</button>
            </div>

            <div id="menu-usuario-dropdown" style="display: none;">
              <div class="menu-dropdown-conteudo">
                <div class="avatar-grande">👤</div>
                <h3 id="menu-nome">Nome</h3>
                <p id="menu-email">email@provedor.com</p>
                <hr class="divisor-menu">
                <button id="btn-logout-google" onclick="fazerLogout()">Sair da conta</button>
              </div>
            </div>
          </div>

    </header>

   <div class="login" style="display: none;">
      <div class="login-content">
        <button class="bt-fechar-login" onclick="btnAbalogin()">X</button>
        <h2>Faça login na plataforma</h2>
        <p>Conecte-se usando sua conta do Crie ou Entre.</p>

        <div class="login-buttons">
          <button onclick="btnIrParaCadastrar()">
            Criar Conta
          </button>

          <button onclick="btnIrParaEntrar()">
            Entrar
          </button>

        </div>
      </div>
    </div>

    <div class="Entrar" style="display: none;">
      <div class="entrar-content">
        <button class="bt-voltar-entrar" onclick="btnVoltarParaMenu()"><</button>
        <button class="bt-fechar-entrar" onclick="btnAbalogin()">X</button>
        <h2>Faça login na plataforma</h2>

        <input type="text" class="Email1" placeholder="Email" />
        <input type="password" class="Senha1" placeholder="Senha" />

        <button class="bntEntrar" onclick="EntrarLogin()">Entrar</button>
            <button
      type="button" class="btn-reenviar-confirmacao"onclick="reenviarConfirmacao()">Não recebeu o e-mail? Reenviar confirmação</button>
      </div>
    </div>

    <div class="Cadastrar" style="display: none;">
      <div class="entrar-content">
        <button class="bt-voltar-entrar" onclick="btnAbalogin()">X</button>
        <button class="bt-fechar-entrar" onclick="btnAbalogin()">X</button>
        <h2>Crie sua conta</h2>

        <input type="text" class="EmailCadastro" placeholder="Email" />
        <input type="password" class="SenhaCadastro" placeholder="Senha" />
        <input type="text" class="NomeCadastro" placeholder="Nome" />



        <button class="bntEntrar" onclick="CriarLogin()">Cadastrar</button>
      </div>
    </div>

    <div class="Cadastrar" style="display: none;">
      <div class="entrar-content">
        <button class="bt-voltar-entrar" onclick="btnAbaVoltarCadastro()"><</button>
        <h2>Crie sua conta</h2>

        <input type="text" class="EmailCadastro" placeholder="Email" />
        <input type="password" class="SenhaCadastro" placeholder="Senha" />

        <button class="bntEntrar" onclick="CriarLogin()">Cadastrar Conta</button>
      </div>
    </div>



    <section class="LoginCubo1">
      <div class="cabecalho-conteudo">

        <div class="cabecalho-esquerda">
          <h2 class="h2Cabecalho">Olá, Faça seu login!</h2>
          <h4 class="h4Cabecalho" id="data-cabecalho"></h4>

          <div class="busca-container">
            <input
              type="text"
              placeholder="Buscar Barbearias"
              class="buscBarb"
            />
            <button class="btnPesquisa" onclick="PesBtn()"></button>
          </div>
          <div class="agendamentos">
           <br><br>

           <article class="card-agendamento">
            <div class="lado-esquerdo">
              <span class="status confirmado">Confirmado</span>
              <h3 id="nome-do-serviço-card-de-agendamento">Corte de cabelo</h3>

              <div class="barbearia-mini">
                <img src="../../img/logo/imagem7.svg" alt="Vintage Barber" />
                <span>Vintage Barber</span>
              </div>
            </div>

            <div class="lado-direito">
              <span>Fevereiro</span>
              <h2>06</h2>
              <span>09:45</span>
            </div>
          </article>
          </div>
        </div>

        <div class="Recomendados">
          <h2 class="RECO">Recomendados</h2>

          <button class="btn-scrollEs esquerda" onclick="rolarRecomendados(-1)">
            ❮
          </button>

          <!-- Container vazio - preenchido pelo seed.js -->
          <div id="cardsRecomendados">
            
          </div>

          <button class="btn-scrollDi direita" onclick="rolarRecomendados(1)">
            ❯
          </button>
        </div>
      </div>
    </section>

    <section class="Populares">
      <h2 class="POPU">Populares</h2>

      <button class="btn-scrollEs esquerda" onclick="rolarPopulares(-1)">
        ❮
      </button>

      <!-- Container vazio - preenchido pelo seed.js -->
      <div id="cardsPopulares"></div>

      <button class="btn-scrollDi direita" onclick="rolarPopulares(1)">
        ❯
      </button>
    </section>

    <section class="MaisVisitados">
      <h2 class="MaisVis">Mais Visitados</h2>

      <button class="btn-scrollEs esquerda" onclick="rolarMaisVisitados(-1)">
        ❮
      </button>

      <!-- Container vazio - preenchido pelo seed.js -->
      <div id="cardsMaisVisitados"></div>

      <button class="btn-scrollDi direita" onclick="rolarMaisVisitados(1)">
        ❯
      </button>
    </section>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="seed.js"></script>
    <script src="script.js"></script>
  </body>
</html>
