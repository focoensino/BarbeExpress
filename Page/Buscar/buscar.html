<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS geral -->
    <link
      rel="stylesheet"
      href="../../style.css"
    />

    <!-- CSS do perfil compartilhado -->
    <link
      rel="stylesheet"
      href="../../perfil-header.css"
    />

    <!-- CSS da página de busca -->
    <link
      rel="stylesheet"
      href="./buscar.css"
    />

    <title>
      Buscar barbearias | BarberExpress
    </title>
  </head>

  <body>
    <header class="topo">
      <a
        href="../../index.html"
        class="logo"
        aria-label="Voltar para a página inicial"
      >
        <img
          class="logo-tesoura"
          src="../../img/logo/Tesoura.svg"
          alt=""
        />

        <img
          class="logo-nome"
          src="../../img/logo/nomeLogo.svg"
          alt="BarberExpress"
        />
      </a>

      <div class="busca-container">
        <input
          type="search"
          placeholder="Buscar barbearias"
          class="buscBarb"
          autocomplete="off"
          aria-label="Buscar barbearias"
        />

        <button
          type="button"
          class="btnPesquisa"
          aria-label="Pesquisar"
        ></button>
      </div>

      <!-- O perfil será colocado aqui -->
      <div data-component="perfil-header"></div>
    </header>

    <main class="pagina-busca">
      <section class="cabecalho-resultados">
        <span class="subtitulo-resultados">
          BarberExpress
        </span>

        <h1
          id="titulo-resultados"
          aria-live="polite"
        >
          Digite para buscar barbearias
        </h1>

        <p class="descricao-resultados">
          Encontre uma barbearia e reserve seu
          horário.
        </p>
      </section>

      <section
        id="cardsResultadoBusca"
        class="lista-resultados"
        aria-live="polite"
      ></section>

      <p
        id="mensagem-busca"
        class="mensagem-busca"
        aria-live="polite"
        hidden
      ></p>
    </main>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Cria window.supabaseClient -->
    <script src="../../supabase-client.js"></script>

    <!-- Controla login e perfil -->
    <script src="../../perfil-header.js"></script>

    <!-- Carrega Components/perfil-header.html -->
    <script src="../../render.js"></script>

    <!-- Pesquisa e criação dos cards -->
    <script src="./buscar.js"></script>
  </body>
</html>
