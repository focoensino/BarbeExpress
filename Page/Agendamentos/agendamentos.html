<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarberExpress - Agendamentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sora:wght@100..800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="agendamento.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="topo">
    <a href="../../index.html" class="logo">
      <img src="../../img/logo/Tesoura.svg" alt="Logo Tesoura" />
      <img src="../../img/logo/nomeLogo.svg" alt="BarberExpress" />
    </a>

    <div class="pesquisa">
      <input type="text" class="PesqBarb" placeholder="Buscar Barbearias" />
      <div class="divPesq">
        <img src="../../img/icon/lupa.svg" class="imgLup" alt="Pesquisar" />
      </div>
    </div>

    <div class="div-perfil">
      <a href="./agendamentos.html">
        <img src="../../img/icon/agenda.svg" class="icone-agenda" alt="Ícone Agenda" />
      </a>

      <a id="agendamentotopo" href="./agendamentos.html">
        <h4>Agendamentos</h4>
      </a>

      <div class="perfil">
        <span id="foto-do-perfil" class="avatar-header"></span>
        <h2 id="nome-do-perfil">Carregando...</h2>
      </div>
    </div>
  </header>

  <!-- MODAL CANCELAMENTO -->
  <div class="modal-cancelar-agendamento">
    <div class="modal-Texto">
      <h2>Cancelar agendamento</h2>
      <p>Tem certeza que deseja cancelar o agendamento?</p>
    </div>

    <div class="botoes">
      <button class="fechar-modal">Voltar</button>
      <button class="cancelar-agendamento">Confirma</button>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="centro">
    <!-- CONTAINER DE LISTAGEM DE AGENDAMENTOS -->
    <section class="agendamentos-container">
      <div class="agendamentos">
        <h1>Agendamentos</h1>

        <div class="grupo">
          <h2>CONFIRMADOS</h2>
          <!-- JS injetará os cards confirmados aqui -->
          <div id="container-confirmados"></div>
        </div>
      </div>

      <div class="grupo finalizados">
        <h2>FINALIZADOS</h2>
        <!-- JS injetará os cards finalizados aqui -->
        <div id="container-finalizados"></div>
      </div>
    </section>

    <!-- SIDEBAR DE DETALHES DA BARBEARIA -->
    <aside class="info-card" id="info-barbearia">
      <img class="banner" id="barbearia-mapa" src="" alt="Mapa da barbearia" />

      <div class="info-conteudo">
        <div class="cabecalho">
          <img id="barbearia-logo" src="" alt="Logo Barbearia" />

          <div class="dados">
            <h3 id="barbearia-nome">Carregando...</h3>
            <p id="barbearia-endereco">...</p>
          </div>
        </div>

        <div class="info-conteudo">
          <h4>SOBRE NÓS</h4>
          <p class="descricao" id="barbearia-sobre">...</p>
        </div>

        <div class="telefone">
          <img src="../../img/icon/telefone.svg" alt="Telefone" />
          <span id="barbearia-tel1">...</span>
          <button class="btn-copiar">Copiar</button>
        </div>

        <div class="telefone">
          <img src="../../img/icon/telefone.svg" alt="Telefone" />
          <span id="barbearia-tel2">...</span>
          <button class="btn-copiar">Copiar</button>
        </div>

        <!-- QUADRO DE RESUMO DO PRÓXIMO AGENDAMENTO -->
        <div class="reserva" id="card-reserva" style="display: none;">
          <span class="status confirmado">Confirmado</span>

          <div class="quadradoFres">
            <div class="linha">
              <span>Serviço</span>
              <strong id="reserva-servico">-</strong>
            </div>

            <div class="linha">
              <span>Preço</span>
              <strong id="reserva-preco">-</strong>
            </div>

            <div class="linha">
              <span>Data</span>
              <strong id="reserva-data">-</strong>
            </div>

            <div class="linha">
              <span>Horário</span>
              <strong id="reserva-horario">-</strong>
            </div>

            <div class="linha">
              <span>Barbearia</span>
              <strong id="reserva-barbearia">-</strong>
            </div>
          </div>

          <button class="cancelar" id="btn-cancelar-reserva">Cancelar Reserva</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase-client.js"></script>
  <script src="./agendamento.js"></script>
</body>

</html>
