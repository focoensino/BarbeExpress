<div
  class="div_perfil"
  id="area-perfil"
>
  <a
    href="/Page/Agendamentos/agendamentos.html"
    id="agendamentos-link"
    class="agendamentos-link"
    hidden
  >
    <img
      src="/img/icon/agenda.svg"
      id="icon-agenda"
      alt=""
    />

    <span id="agendamentos-texto">
      Agendamentos
    </span>
  </a>

  <div id="container-perfil">
    <button
      type="button"
      id="perfil"
    >
      Entrar
    </button>
  </div>

  <div
    id="menu-usuario-dropdown"
    hidden
  >
    <div class="menu-dropdown-conteudo">
      <div
        id="menu-avatar"
        class="avatar-grande"
      >
        U
      </div>

      <h3 id="menu-nome">
        Usuário
      </h3>

      <p id="menu-email">
        email@provedor.com
      </p>

      <hr class="divisor-menu" />

      <button
        type="button"
        id="btn-logout"
      >
        Sair da conta
      </button>
    </div>
  </div>
</div>

<div
  class="modal-autenticacao login"
  hidden
>
  <div class="modal-conteudo">
    <button
      type="button"
      class="fechar-modal"
      aria-label="Fechar"
    >
      ×
    </button>

    <h2>Acesse a plataforma</h2>

    <p>
      Entre na sua conta ou crie um cadastro
      para realizar agendamentos.
    </p>

    <div class="opcoes-autenticacao">
      <button
        type="button"
        id="abrir-cadastro"
      >
        Criar conta
      </button>

      <button
        type="button"
        id="abrir-login"
      >
        Entrar
      </button>
    </div>
  </div>
</div>

<div
  class="modal-autenticacao Entrar"
  hidden
>
  <div class="modal-conteudo">
    <button
      type="button"
      class="voltar-modal"
      aria-label="Voltar"
    >
      ‹
    </button>

    <button
      type="button"
      class="fechar-modal"
      aria-label="Fechar"
    >
      ×
    </button>

    <h2>Entre na sua conta</h2>

    <input
      type="email"
      class="Email1"
      placeholder="E-mail"
      autocomplete="email"
    />

    <input
      type="password"
      class="Senha1"
      placeholder="Senha"
      autocomplete="current-password"
    />

    <button
      type="button"
      id="confirmar-login"
      class="botao-autenticacao"
    >
      Entrar
    </button>

    <button
      type="button"
      id="reenviar-confirmacao"
      class="botao-link"
    >
      Não recebeu o e-mail? Reenviar confirmação
    </button>
  </div>
</div>

<div
  class="modal-autenticacao Cadastrar"
  hidden
>
  <div class="modal-conteudo">
    <button
      type="button"
      class="voltar-modal"
      aria-label="Voltar"
    >
      ‹
    </button>

    <button
      type="button"
      class="fechar-modal"
      aria-label="Fechar"
    >
      ×
    </button>

    <h2>Crie sua conta</h2>

    <input
      type="text"
      class="NomeCadastro"
      placeholder="Nome"
      autocomplete="name"
    />

    <input
      type="email"
      class="EmailCadastro"
      placeholder="E-mail"
      autocomplete="email"
    />

    <input
      type="password"
      class="SenhaCadastro"
      placeholder="Senha"
      autocomplete="new-password"
    />

    <button
      type="button"
      id="confirmar-cadastro"
      class="botao-autenticacao"
    >
      Cadastrar
    </button>
  </div>
</div>
